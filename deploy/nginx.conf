# Only a reference for febro.id — DO NOT enable alongside the existing febro.id vhost.
# Migrate febro-landing to profile.febro.id first, then switch the existing
# febro.id reverse-proxy upstream to 127.0.0.1:3090, preserving TLS/Certbot.
server {
    listen 80;
    listen [::]:80;
    server_name febro.id www.febro.id;
    client_max_body_size 3m;
    location / {
        proxy_pass http://127.0.0.1:3090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
